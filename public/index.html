<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Envite Canario 2v2</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <div class="app">
      <header class="topbar">
        <div>
          <p class="eyebrow">Multijugador</p>
          <h1>Envite Canario</h1>
        </div>
        <div class="server-state">
          <span id="room-code-badge">Sala: --</span>
        </div>
      </header>

      <main class="panel">
        <section class="setup-box" id="setup-box">
          <div class="field">
            <label for="player-name">Tu nombre</label>
            <input id="player-name" maxlength="18" value="Jugador" />
          </div>

          <div class="field">
            <label for="room-code">Código de la sala</label>
            <input id="room-code" maxlength="5" placeholder="ABCDE" />
          </div>

          <div class="buttons-row">
            <button id="create-room-btn">Crear sala</button>
            <button id="join-room-btn" class="secondary">Unirse</button>
            <button id="spectate-btn" class="secondary">Espectar</button>
          </div>
        </section>

        <section class="game-box hidden" id="game-box">
          <div class="status-row">
            <div>
              <p class="eyebrow">Estado</p>
              <h2 id="status-text">Esperando jugadores</h2>
            </div>
            <div class="action-row">
              <button id="team-a-btn" class="secondary">Equipo A</button>
              <button id="team-b-btn" class="secondary">Equipo B</button>
              <button id="close-room-btn" class="danger">Cerrar sala</button>
            </div>
          </div>

          <div class="table-info">
            <div class="card visible-card">
              <span class="tag">Carta visible</span>
              <strong id="visible-card">-</strong>
            </div>
            <div class="scoreboard">
              <div class="team team-a">
                <span>Equipo A</span>
                <strong id="score-a">0</strong>
              </div>
              <div class="team team-b">
                <span>Equipo B</span>
                <strong id="score-b">0</strong>
              </div>
            </div>
          </div>

          <div class="round-panel">
            <p id="round-text">Ronda 1 de 3</p>
            <p id="result-text">Esperando que los 4 jugadores elijan equipo.</p>
          </div>

          <div class="players-grid" id="players-grid"></div>

          <div class="hand-panel">
            <div class="hand-header">
              <p>Tu mano</p>
              <span id="turn-indicator">Esperando turno</span>
            </div>
            <div class="hand" id="hand"></div>
          </div>
        </section>
      </main>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="/game.js"></script>
  </body>
</html>
