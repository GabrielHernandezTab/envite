<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Envite Bar · Juegos</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div class="ambient ambient-one"></div>
  <div class="ambient ambient-two"></div>

  <div class="app-shell">
    <header class="bar-topbar">
      <div class="brand-lockup">
        <div class="brand-mark">♠</div>
        <div>
          <div class="brand-kicker">LA NOCHE DEL</div>
          <h1>ENVITE BAR</h1>
        </div>
      </div>
      <div class="room-pill"><span>JUEGOS</span></div>
    </header>

    <main class="main-stage">
      <section class="main-menu">
        <p class="eyebrow">Bienvenido a la mesa</p>
        <h2>Elige tu juego</h2>
        <p class="lounge-copy">Selecciona un juego para entrar en su menú principal.</p>
        <a class="game-tile" href="/envite.html" aria-label="Abrir el menú de Envite">
          <span class="game-tile-icon" aria-hidden="true">♠</span>
          <span class="game-tile-info">
            <strong>Envite</strong>
            <span>Baraja española · 2 contra 2</span>
          </span>
          <span class="game-tile-arrow" aria-hidden="true">→</span>
        </a>
      </section>
    </main>
  </div>
</body>
</html>
